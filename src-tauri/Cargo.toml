[package]
name = "film-converter"
version = "0.1.0"
description = "Batch develop film negative scans"
authors = ["Diego Rascón", "Adrián Rascón"]
edition = "2024"
# `<[T]>::as_chunks`, which the pipeline's pixel loops are written with.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "film_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.23.1"
rayon = "1"
# Decoding + PNG/TIFF encoding. Default features pull in AVIF (ravif/dav1d),
# which we do not need and which slows the build down considerably.
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "tiff",
  "bmp",
  "webp",
  "rayon",
] }
# `image`'s own JPEG encoder has no chroma-subsampling control; this one does,
# so we can write 4:4:4 like the Python reference (PIL `subsampling=0`).
jpeg-encoder = { version = "0.7", features = ["std"] }
# SIMD downscaling for previews: about eight times faster than
# `image::imageops::thumbnail` on a 24-megapixel scan. Its `image` dependency
# is declared without default features, so AVIF stays out.
fast_image_resize = { version = "5.5", default-features = false, features = [
  "rayon",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel arithmetic moves between u8, u32, u64 and f64 on purpose, and the
# values involved (channel values, dimensions, pixel counts) fit every type
# they are cast to.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The port compares floats exactly on purpose: it has to match numpy to the
# last bit, and its tests pin that down with `assert_eq!`.
float_cmp = "allow"
# Tauri hands a command its arguments by value.
needless_pass_by_value = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Image decoding in debug builds is painfully slow without this.
[profile.dev.package."*"]
opt-level = 3
